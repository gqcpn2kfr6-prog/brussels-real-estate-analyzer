name: ci
on:
  schedule:
    - cron: "0 6 * * *" # tous les jours 06:00 UTC
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Poetry
        run: pipx install poetry
      - name: Installer dépendances
        run: poetry install --no-interaction --no-root
      - name: Exécuter collecte
        run: poetry run analyzer fetch --source immoweb --city "Bruxelles" --limit 200 || true
      - name: Exécuter analyse
        run: poetry run analyzer analyze --min-yield 4.5 || true
      - name: Générer rapport
        run: poetry run analyzer report || true
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
