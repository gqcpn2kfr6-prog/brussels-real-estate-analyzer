name: pages
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'reports/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Poetry
        run: pipx install poetry
      - name: Installer dépendances
        run: poetry install --no-interaction --no-root
      - name: Générer données et rapport
        run: |
          poetry run analyzer fetch --source immoweb --city "Bruxelles" --limit 200 || true
          poetry run analyzer analyze || true
          poetry run python -c "from analyzer.jobs.report_html import render_html; render_html('reports/index.html')" || true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
