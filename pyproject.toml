[tool.poetry]
name = "brussels-real-estate-analyzer"
version = "0.1.0"
description = "Bot d'analyse du marché immobilier bruxellois"
authors = ["gqcpn2kfr6-prog"]
packages = [{include = "analyzer"}]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2.2"
polars = "^1.5.0"
numpy = "^2.1.0"
pydantic = "^2.9.0"
duckdb = "^1.1.0"
typer = {extras = ["all"], version = "^0.12.5"}
httpx = "^0.27.0"
beautifulsoup4 = "^4.12.3"
playwright = "^1.47.0"
scikit-learn = "^1.5.0"
geopandas = "^1.0.1"
shapely = "^2.0.4"
python-dotenv = "^1.0.1"
pyarrow = "^17.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.6.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
